# 매일 오전 9시(한국 시간)에 체스퀸 대회 일정(events.json)과 블로그 공지(notices.json)를 갱신한다.
# 바뀐 내용이 있을 때만 커밋하고, GitHub Pages가 그 커밋으로 홈페이지를 다시 올린다.
name: update-events
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/update_events.py --self-test && python3 scripts/update_events.py
      # 블로그 공지(notices.json). 블로그를 못 읽어도 대회 정보 갱신은 계속한다
      - run: python3 scripts/update_notices.py --self-test && python3 scripts/update_notices.py
        continue-on-error: true
      - name: commit if changed
        run: |
          if git diff --quiet events.json notices.json; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json notices.json
          git commit -m "대회 정보·블로그 공지 자동 갱신 $(TZ=Asia/Seoul date +%F)"
          git push
